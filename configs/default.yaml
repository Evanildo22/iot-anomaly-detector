# Default hyperparameters for IoT Anomaly Detector
# These were found via Bayesian optimisation (BayesSearchCV) on N-BaIoT.

model:
  filters: 112
  kernel_size: 6
  dense_units: 43
  dropout_rate: 0.4276472224858223
  l1_reg: 2.905161222313691e-06
  l2_reg: 0.0006250186493731686

training:
  learning_rate: 0.0003013824603999272
  pretrain_epochs: 30
  finetune_epochs: 50
  batch_size: 256
  early_stopping_patience: 10
  random_state: 42

data:
  # Fraction of the full dataset reserved for each split
  val_size: 0.15
  test_size: 0.15
  realtime_size: 0.05
  # Preprocessing
  n_top_features: 15
  pca_variance: 0.95
  correlation_threshold: 0.80
  resample: true
  session_timeout: 120.0   # seconds (PCAP parser only)

paths:
  save_dir: checkpoints
  log_dir: logs
